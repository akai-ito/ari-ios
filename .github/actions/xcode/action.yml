name: Xcode
description: Checks that the job has the Xcode in DEVELOPER_DIR and, when asked, generates Ari.xcodeproj.
inputs:
  project:
    description: Also install the pinned XcodeGen and generate Ari.xcodeproj from project.yml.
    default: "false"
runs:
  using: composite
  steps:
    - name: Check the Xcode version
      shell: bash
      run: |
        # No pipe: xcodebuild crashes writing to one that closes early, as `head -n 1` does.
        if ! output=$(xcodebuild -version); then
          echo "::error title=No Xcode::There is no working Xcode at $DEVELOPER_DIR. If the runner image changed, update DEVELOPER_DIR in .github/workflows/ci.yml."
          exit 1
        fi
        version=${output%%$'\n'*}
        echo "$version ($DEVELOPER_DIR)"
        case "$version" in
          "Xcode 27.0" | "Xcode 27.0."*) ;;
          *)
            echo "::error title=Unexpected Xcode::Ari builds with Xcode 27.0, but $DEVELOPER_DIR is $version. If the runner image changed, update DEVELOPER_DIR in .github/workflows/ci.yml."
            exit 1
            ;;
        esac

    - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
      if: inputs.project == 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/xcodegen-release"
        curl -fsSL -o "$archive" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
        if ! echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 -c -; then
          echo "::error title=XcodeGen checksum::The XcodeGen $XCODEGEN_VERSION download doesn't match XCODEGEN_SHA256 in .github/workflows/ci.yml."
          exit 1
        fi
        unzip -q "$archive" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

    - name: Generate Ari.xcodeproj
      if: inputs.project == 'true'
      shell: bash
      run: xcodegen generate
