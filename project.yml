# Ari.xcodeproj is generated from this file with XcodeGen (`xcodegen generate`) and is not committed.
name: Ari
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
configFiles:
  Debug: Config/Ari.xcconfig
  Release: Config/Ari.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  AriKit:
    path: AriKit
targets:
  Ari:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Ari
        type: syncedFolder
    dependencies:
      - package: AriKit
      # The notification service extension decrypts each push on the iPhone.
      - target: AriNotificationService
        destinationFilters: [iOS]
      # Share to Ari, from any app's share sheet.
      - target: AriShare
        destinationFilters: [iOS]
    settings:
      base:
        # Push, time-sensitive asks, and the app group the notification extension shares.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Ari/Ari-iOS.entitlements
        # XcodeGen gives a multiplatform target its iOS presets; undo the two that are wrong for
        # the Mac. With the SDK's default identity, the Mac signs to run locally until a team is set.
        CODE_SIGN_IDENTITY: $(inherited)
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "@executable_path/../Frameworks"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone first: no iPad layout yet, and no "Designed for iPhone" listing on Vision Pro.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ari
        # Only to scan the QR code ito pair shows.
        "INFOPLIST_KEY_NSCameraUsageDescription[sdk=iphone*]": "Ari uses the camera to scan the pairing code your server shows."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES
        # Colours live in the asset catalogue; Xcode makes Color.ariBackground and the rest from it.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Ari at rest is the icon; Peeking, looking up at you, is the one you can switch to.
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": AppIconPeeking
        # Dark first: the light values come later, and then this goes.
        "INFOPLIST_KEY_UIUserInterfaceStyle[sdk=iphone*]": Dark
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Only the Mac build turns these into entitlements; iOS ignores them.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Files you pick to attach.
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_HARDENED_RUNTIME: YES
    # ito://pair links, from the QR code ito pair shows: the Camera app opens them in Ari.
    info:
      path: Config/Ari-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).pair
            CFBundleURLSchemes: [ito]
    # Ari.xcodeproj isn't in git: a project generated before project.yml last changed builds fine
    # but quietly lacks its newer settings, such as entitlements. Stop and say so instead.
    preBuildScripts:
      - name: Check the project is up to date
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/project.yml
          - $(PROJECT_FILE_PATH)/project.pbxproj
        script: |
          if [ "$SRCROOT/project.yml" -nt "$PROJECT_FILE_PATH/project.pbxproj" ]; then
            echo "error: project.yml has changed since Ari.xcodeproj was made. Run xcodegen generate."
            exit 1
          fi
    scheme:
      testTargets:
        - package: AriKit/AriKitTests
  AriNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: AriNotificationService
        excludes: ["*.entitlements"]
    dependencies:
      - package: AriKit
    info:
      path: AriNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Ari
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ARI_BUNDLE_ID).NotificationService
        CODE_SIGN_ENTITLEMENTS: AriNotificationService/AriNotificationService.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # The system calls the extension off the main thread.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  AriShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AriShare
        excludes: ["*.entitlements"]
      # Ari's colours.
      - path: Ari/Assets.xcassets
    dependencies:
      - package: AriKit
    info:
      path: AriShare/Info.plist
      properties:
        CFBundleDisplayName: Ari
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ARI_BUNDLE_ID).Share
        CODE_SIGN_ENTITLEMENTS: AriShare/AriShare.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  # The app's interactions, driven as you would on the phone. Opt in: they need ito-core's demo
  # engine running and Ari connected to it in the Simulator, so CI doesn't run them (see README).
  AriUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AriUITests]
    dependencies:
      - target: Ari
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ari
    scheme:
      testTargets: [AriUITests]
