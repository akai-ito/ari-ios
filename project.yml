# Ari.xcodeproj is generated from this file with XcodeGen (`xcodegen generate`) and is not committed.
name: Ari
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
configFiles:
  Debug: Config/Ari.xcconfig
  Release: Config/Ari.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  AriKit:
    path: AriKit
targets:
  Ari:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Ari
        type: syncedFolder
    dependencies:
      - package: AriKit
    settings:
      base:
        # XcodeGen gives a multiplatform target its iOS presets; undo the two that are wrong for
        # the Mac. With the SDK's default identity, the Mac signs to run locally until a team is set.
        CODE_SIGN_IDENTITY: $(inherited)
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "@executable_path/../Frameworks"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone first: no iPad layout yet, and no "Designed for iPhone" listing on Vision Pro.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ari
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES
        # Colours live in the asset catalogue; Xcode makes Color.ariBackground and the rest from it.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Ari at rest is the icon; Peeking, looking up at you, is the one you can switch to.
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": AppIconPeeking
        # Dark first: the light values come later, and then this goes.
        "INFOPLIST_KEY_UIUserInterfaceStyle[sdk=iphone*]": Dark
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Only the Mac build turns these into entitlements; iOS ignores them.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - package: AriKit/AriKitTests
